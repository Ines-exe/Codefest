<!DOCTYPE html>
<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <button onclick="window.location.href=''">Back to Home Page</button>
        
        <div class="card-container">
            <div class="card">
                    <h3>Sign Up</h3>
                    <div class="card-body">
                    <form action=""{{ url_for("gfg")}}" method="post"></form>
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="fname" placeholder="first name">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lname" placeholder="last name">
                    <button type="submit">Sign in</button>
                    </div>
            </div>
        </div>
    </body>
</html>
