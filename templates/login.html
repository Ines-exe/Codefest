<!DOCTYPE html>
<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="static/login.css">
    </head>
    <body>
        <button onclick="window.location.href='/index'">Back to Options</button>
        
        <div class="card-container">
            <div class="card">
                    <h3>Login</h3>
                    
                    <form action="/login" method="POST" class="card-body" autocomplete = "off">
                        
                        <div>
                            <label for="username">Username:</label>
                            <input type="text" id="username" name="username" placeholder="Enter your username">
                        </div>
                        <div>
                            <label for="pass">Password:</label>
                            <input type="password" id="pass" name="password" minlength="8" required="" placeholder="Enter your password">
                        </div>

                        <div>
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email">
                        </div>

                        <button type="submit">Login</button>
                        
                    </form>   
            </div>
        </div>
    </body>
</html>
