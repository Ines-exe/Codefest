<!DOCTYPE html>
<html>
<head>
    <title>Find Food</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <h1>Find Food Near You</h1>
    <form action="{{ url_for('users2') }}" method="post">
        <div>
            <label>Max Distance (miles):</label>
            <input type="number" name="max_distance" placeholder="e.g. 5">
        </div>
        <div>
            <label>Date:</label>
            <input type="date" name="date">
        </div>
        <div>
            <label>Time:</label>
            <input type="time" name="time">
        </div>
        <div>
            <label>Category:</label>
            <select name="user_category">
                <option value="">Select a category</option>
                <option value="Free Grocery Site">Free Grocery</option>
                <option value="General Meal Site">General Meal</option>
                <option value="Food Pantry">Food Pantry</option>
            </select>
        </div>
        <button type="submit">Find Food</button>
    </form>

    <div id="map" style="height: 400px; margin-top: 20px;"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/maps.js"></script>
</body>
</html>
