<!DOCTYPE html>
<html>
<head>
    <title>Make a Donation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='donate.css') }}"/>

</head>
<body>
    <h1>Enter the Follow Information on Your Event:</h1>
    <form action="{{ url_for('donate') }}" method ="post">
        <div>
            <label for="Address">Address:</label>
            <input type="text" id="Address" name ="address">
        </div>
        <div>
            <label for="siteName">Site Name:</label>
            <input type="text" id="siteName" name ="site_name">
        </div>
        <div>
            <label for="Email">Email:</label>
            <input type="text" id="Email" name ="email">
        </div>
        <div>
            <label for="phoneNumber">Phone Number:</label>
            <input type="text" id="phoneNumber" name ="phone_number">
        </div>
        <div>
            <label for="Category">Address</label>
            <input type="text" id="Category" name ="category">
        </div>
        <div>
           <label>What week days are you open?</label>
            <div class="checkbox-row">
                <label><input type="checkbox" name="days" value="Monday"> Monday</label>
                <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
                <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
                <label><input type="checkbox" name="days" value="Thursday"> Thursday</label>
                <label><input type="checkbox" name="days" value="Friday"> Friday</label>
                <label><input type="checkbox" name="days" value="Saturday"> Saturday</label>
                <label><input type="checkbox" name="days" value="Sunday"> Sunday</label>
            </div>
        </div>    
        <div>
            <label>Start time</label>
            <input type="time" name ="open_time">
        </div>
        <div>
            <label>Closing time:</label>
            <input type="time"  name ="close_time">
        </div>

        <button type ="submit">Enter</button>
        
    </form>
</body>
</html>
