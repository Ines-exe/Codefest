<!DOCTYPE html>
<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="static/signupUser.css">
    </head>
    <body>
        <button onclick="window.location.href='index'">Back to Options</button>
        
        <div class="card-container">
            <div class="card">
                    <h3>User Sign Up</h3>
                    <div class="card-body">
                    <form action="{{ url_for('signupUser')}}" method="post"></form>
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="fname" placeholder="first name">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lname" placeholder="last name">
                    <label for="password"> Password:</label>
                    <input type="text" id="password" name="pword" placeholder="password">
                    <button onclick="window.location.href='/user'">Login</button>
                    </div>
            </div>
        </div>
    </body>
</html>
